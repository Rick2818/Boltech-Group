name: ASMAS RSI-01 09:00 SV watchdog
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/asmas_research_watchdog.js'
      - 'lib/rsi_agent_executor.js'
      - 'lib/sdr_campaign.js'
      - 'api/partners.js'
      - 'tests/test_asmas_research_watchdog.mjs'
      - '.github/workflows/asmas_rsi01_9am.yml'
permissions:
  contents: read
concurrency:
  group: boltech-rsi-agent-execution
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify research watchdog and SDR campaign
        run: node --test tests/test_asmas_research_watchdog.mjs tests/test_sdr_campaign.mjs
      - name: Execute cloud RSI team (no local computer needed)
        if: github.event_name != 'pull_request'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          RSI_EXPECT_DEPLOYMENT_SHA: ''
        run: node scripts/ops/run_rsi_agents.mjs
      - name: Execute approved RSI-01 outreach only
        if: github.event_name != 'pull_request'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: |
          node --input-type=module -e '
          const key=process.env.PARTNER_API_TOKEN;
          if(!key)process.exit(1);
          const res=await fetch("https://boltech-group.vercel.app/api/partners?action=sdr-campaign",{
            method:"POST",headers:{Authorization:"Bearer "+key},signal:AbortSignal.timeout(60000)});
          const body=await res.json();
          const report={time:new Date().toISOString(),status:res.status,reviewed:body.reviewed||0,eligible:body.eligible||0,approvedTotal:body.approvedTotal||0,pendingApproval:body.pendingApproval||0,cycleStatus:body.cycleStatus||"UNCONFIRMED",results:body.results||[],code:body.code||null};
          const fs=await import("node:fs");fs.mkdirSync("ops-output",{recursive:true});fs.writeFileSync("ops-output/rsi01-campaign.json",JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          if(!res.ok||!body.success)process.exit(1);
          '
      - name: Preserve execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asmas-rsi01-9am-${{ github.run_id }}
          path: |
            ops-output/rsi-agent-execution.json
            ops-output/rsi01-campaign.json
          if-no-files-found: warn
          retention-days: 30
