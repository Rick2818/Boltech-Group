name: ASMAS RSI-01 09:00 SV watchdog
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/asmas_research_watchdog.js'
      - 'lib/rsi_agent_executor.js'
      - 'tests/test_asmas_research_watchdog.mjs'
      - '.github/workflows/asmas_rsi01_9am.yml'
permissions:
  contents: read
concurrency:
  group: boltech-rsi-agent-execution
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify research watchdog
        run: node --test tests/test_asmas_research_watchdog.mjs
      - name: Execute cloud RSI team (no local computer needed)
        if: github.event_name != 'pull_request'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          RSI_EXPECT_DEPLOYMENT_SHA: ''
        run: node scripts/ops/run_rsi_agents.mjs
      - name: Preserve execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asmas-rsi01-9am-${{ github.run_id }}
          path: ops-output/rsi-agent-execution.json
          if-no-files-found: warn
          retention-days: 30
