name: Apollo Production Acceptance
on:
  workflow_dispatch:
    inputs:
      verify_crm:
        description: 'Synchronize one existing saved Apollo contact with HubSpot and verify deduplication (no email)'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: boltech-apollo-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authenticated production acceptance
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          VERIFY_CRM: ${{ inputs.verify_crm }}
        run: node scripts/ops/verify_apollo_production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apollo-verification-${{ github.run_id }}
          path: ops-output/apollo-verification.json
          if-no-files-found: error
          retention-days: 30
