name: Boltech Controlled CRM Contact Test
on:
  push:
    branches: [codex/crm-smoke-test]
    paths: ['.github/workflows/boltech_crm_contact_test.yml']
  workflow_dispatch:
    inputs:
      resume_test_job:
        description: 'Resume only the controlled test job after correcting HubSpot credentials'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: boltech-crm-recovery
  cancel-in-progress: false
jobs:
  contact-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify controlled contact sync and identical-payload deduplication
        env:
          RESUME_TEST_JOB: 'true'
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: node scripts/ops/crm_contact_smoke_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-contact-test-${{ github.run_id }}
          path: ops-output/crm-contact-smoke-test.json
          retention-days: 30
          if-no-files-found: error
