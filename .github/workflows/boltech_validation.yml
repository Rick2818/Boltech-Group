name: Boltech Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate partner, truth, payment and MCP safeguards
        run: node --test tests/test_partner_network.mjs tests/test_operational_truth_guards.mjs tests/test_payment_security_v2.mjs tests/test_mcp_remote_auth.mjs tests/test_mcp_remote_handshake.mjs
