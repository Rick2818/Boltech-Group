name: Boltech Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Check server module syntax
        run: npm run build
      - name: Measure partner, truth, payment and MCP safeguards
        run: node scripts/quality/improvement_cycle.mjs
      - name: Validate commercial decision logic
        run: npm run test:commercial
      - name: Preserve improvement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improvement-cycle-${{ github.run_id }}
          path: artifacts/improvement-cycle/
          if-no-files-found: warn
          retention-days: 30
