name: Boltech Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated synthetic campaign
        run: node --test tests/test_synthetic_campaign_qa.mjs tests/test_synthetic_relay_chain.mjs tests/test_commercial_relay.mjs tests/test_director_notifications.mjs
      - name: Verify continuous research, scheduler authentication and canonical followups
        run: node --test tests/test_agent1_continuous_cycle.mjs tests/test_agent1_autonomous_inbox.mjs tests/test_explee_hot_leads_sync.mjs tests/test_canonical_followups.mjs tests/test_canonical_followup_sender.mjs tests/test_canonical_outreach.mjs
      - name: Verify Marketing skill execution and role handoff
        run: node --test tests/test_marketing_autonomy.mjs tests/test_marketing_skill_executor.mjs tests/test_director_audit_status.mjs tests/test_director_tracking.mjs
      - name: Verify synthetic follow-up to qualification and Director supervision
        run: node --test tests/test_rsi01_followups.mjs tests/test_followup_work_sync.mjs tests/test_rsi02_inbox_executor.mjs tests/test_director_audit_status.mjs tests/test_director_tracking.mjs tests/test_director_ownership.mjs
      - name: Preserve isolated QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-campaign-qa-${{ github.run_id }}
          path: ops-output/synthetic-qa/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify specialist UI, bilingual controls and voice regression
        run: node --test tests/test_boltech_specialist_ui_regression.mjs
      - name: Verify bilingual reception regression
        run: node --test tests/test_reception_bilingual_qa.mjs
      - name: Verify Leo language switch preserves session
        run: node --test tests/test_leo_language_session_regression.mjs
      - name: Verify Groq model fallback and 404 recovery
        run: node --test tests/test_specialist_groq_model_fallback.mjs
      - name: Check server module syntax
        run: npm run build
      - name: Measure partner, truth, payment and MCP safeguards
        run: node scripts/quality/improvement_cycle.mjs
      - name: Verify retired outbound cannot dispatch
        run: node --test tests/test_legacy_dispatch_retirement.mjs
      - name: Validate commercial decision logic
        run: npm run test:commercial
      - name: Preserve improvement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improvement-cycle-${{ github.run_id }}
          path: artifacts/improvement-cycle/
          if-no-files-found: warn
          retention-days: 30
