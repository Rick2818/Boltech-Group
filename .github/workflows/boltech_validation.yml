name: Boltech Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated synthetic campaign
        run: node --test tests/test_synthetic_campaign_qa.mjs tests/test_synthetic_relay_chain.mjs tests/test_commercial_relay.mjs tests/test_director_notifications.mjs
      - name: Verify synthetic follow-up to qualification and Director supervision
        run: node --test tests/test_rsi01_followups.mjs tests/test_followup_work_sync.mjs tests/test_rsi02_inbox_executor.mjs tests/test_director_audit_status.mjs tests/test_director_tracking.mjs tests/test_director_ownership.mjs
      - name: Preserve isolated QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-campaign-qa-${{ github.run_id }}
          path: ops-output/synthetic-qa/
          retention-days: 30
          if-no-files-found: warn
      - name: Check server module syntax
        run: npm run build
      - name: Verify Upwork OAuth callback safety
        run: node --test tests/test_upwork_oauth.mjs
      - name: Measure partner, truth, payment and MCP safeguards
        run: node scripts/quality/improvement_cycle.mjs
      - name: Verify retired outbound cannot dispatch
        run: node --test tests/test_legacy_dispatch_retirement.mjs
      - name: Validate commercial decision logic
        run: npm run test:commercial
      - name: Preserve improvement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improvement-cycle-${{ github.run_id }}
          path: artifacts/improvement-cycle/
          if-no-files-found: warn
          retention-days: 30

