name: SDR connection verification (no outreach)
on:
  push:
    branches: [main]
    paths:
      - 'lib/sdr_gmail.js'
      - 'lib/sdr_dispatch.js'
      - 'lib/telegram_cloud_processor.js'
      - 'lib/telegram_free_operations.js'
      - 'tests/test_telegram_free_operations.mjs'
      - 'scripts/ops/verify_sdr_production.mjs'
      - '.github/workflows/sdr_connection_verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: node --test tests/test_sdr_dispatch.mjs tests/test_operational_privacy.mjs tests/test_telegram_free_operations.mjs
      - run: node scripts/ops/verify_sdr_production.mjs
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdr-connection-${{ github.run_id }}
          path: ops-output/sdr-production-verification.json
          retention-days: 30
