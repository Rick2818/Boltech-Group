name: Boltech Production Health Watch
run-name: "Production health | ${{ github.event.schedule || github.event_name }}"

on:
  schedule:
    - cron: '30 12 * * 1-5'
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/boltech_health_check.yml'
      - 'scripts/ops/production_watch.mjs'
      - 'tests/test_operational_privacy.mjs'
      - 'tests/test_production_watch.mjs'
      - 'api/partners.js'
      - 'api/payments.js'
      - 'lib/operational_auth.js'
      - 'lib/payment_providers.js'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-watch-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'validation' || 'monitor' }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate monitoring and private diagnostics
        run: node --test tests/test_telegram_repair.mjs tests/test_operational_privacy.mjs tests/test_production_watch.mjs
  health:
    if: github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for privacy deployment on main pushes
        if: github.event_name == 'push'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              const response = await fetch('https://boltech-group.vercel.app/api/partners?action=metrics', { signal: AbortSignal.timeout(10000) });
              if (response.status === 401) {
                const diagnostic = await fetch('https://boltech-group.vercel.app/api/payments?action=readiness-internal', {
                  headers: { Authorization: 'Bearer ' + process.env.PARTNER_API_TOKEN }, signal: AbortSignal.timeout(15000)
                });
                const data = await diagnostic.json();
                if (diagnostic.status === 200 && data.wompiHealthContractVersion === 2) { ready = true; break; }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          if (!ready) throw new Error('Privacy deployment not ready within monitoring grace period.');
          JS
      - name: Replace Telegram destination authorized by Ricardo
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops: execute authorized Boltech Telegram destination replacement 2026-10-05'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = String(process.env.PARTNER_API_TOKEN || '').trim();
          if (!token) throw new Error('ADMIN_MONITOR_CREDENTIAL_MISSING');
          let restored = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch('https://boltech-group.vercel.app/api/telegram?action=replace-webhook', {
              method: 'POST', headers: { Authorization: 'Bearer ' + token },
              signal: AbortSignal.timeout(20000)
            });
            const data = await response.json();
            if (response.ok && data.ok === true) { restored = true; break; }
            if (response.status !== 401) throw new Error('AUTHORIZED_TELEGRAM_REPLACEMENT_FAILED');
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          if (!restored) throw new Error('TELEGRAM_DEPLOYMENT_NOT_READY');
          console.log('Authorized Boltech webhook replacement completed; pending updates preserved.');
          JS
      - name: Recover missing Boltech Telegram webhook
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const base = 'https://boltech-group.vercel.app/api/telegram';
          const health = await fetch(base + '?deep=1', { signal: AbortSignal.timeout(15000) });
          const state = await health.json();
          if (!health.ok || state.telegramConfigured !== true) throw new Error('TELEGRAM_DIAGNOSTIC_FAILED');
          if (state.webhookConfigured === false) {
            const token = String(process.env.PARTNER_API_TOKEN || '').trim();
            if (!token) throw new Error('ADMIN_MONITOR_CREDENTIAL_MISSING');
            const repair = await fetch(base + '?action=repair-webhook', {
              method: 'POST', headers: { Authorization: 'Bearer ' + token },
              signal: AbortSignal.timeout(25000)
            });
            const result = await repair.json();
            if (!repair.ok || result.ok !== true) {
              const code = result.code === 'TELEGRAM_OTHER_WEBHOOK_PRESENT'
                ? 'TELEGRAM_OTHER_WEBHOOK_PRESENT' : 'TELEGRAM_REPAIR_FAILED';
              throw new Error(code);
            }
            console.log('TELEGRAM_WEBHOOK_RESTORED; pending updates preserved.');
          }
          JS
      - name: Check production and execution history
        if: ${{ !cancelled() }}
        env:
          WATCH_EVENT_NAME: ${{ github.event_name }}
          WATCH_SCHEDULE: ${{ github.event.schedule }}
          WATCH_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          A2A_MONITOR_TOKEN: ${{ secrets.A2A_MONITOR_TOKEN }}
        run: node scripts/ops/production_watch.mjs
      - name: Preserve sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health-${{ github.run_id }}
          path: ops-output/production-health.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
