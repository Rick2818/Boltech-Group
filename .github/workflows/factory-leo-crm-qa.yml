name: Factory Leo CRM QA
on:
  pull_request:
    paths:
      - 'lib/factory_leo_crm.js'
      - 'tests/test_factory_leo_crm.mjs'
      - '.github/workflows/factory-leo-crm-qa.yml'
  workflow_dispatch:
jobs:
  leo-crm-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_factory_leo_crm.mjs
