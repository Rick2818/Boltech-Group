name: Pdro Imports synthetic delivery acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/customer_support_policy.js'
      - 'lib/pdro_test_business.js'
      - 'scripts/ops/pdro_business_acceptance.mjs'
      - 'lib/customer_support_sandbox.js'
      - 'scripts/ops/pdro_imports_sandbox.mjs'
      - 'scripts/ops/pdro_commercial_rehearsal.mjs'
      - 'tests/test_explee_target_geography.mjs'
      - 'tests/test_leo_provider_diagnostics.mjs'
      - 'cloudflare/pages-leo-audio-worker.mjs'
      - 'lib/customer_onboarding.js'
      - 'lib/sales_dot_pilot.js'
      - 'scripts/ops/build_pdro_delivery_preview.mjs'
      - 'tests/test_customer_support_sandbox.mjs'
      - 'tests/test_pdro_real_handlers_e2e.mjs'
      - '.github/workflows/pdro-imports-synthetic-acceptance.yml'
permissions:
  contents: read
jobs:
  synthetic-order:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Exercise actual commercial and after-sales handlers with Pedro fixture
        run: node --test tests/test_pdro_real_handlers_e2e.mjs
      - name: Rehearse fictional discovery, intake, commercial fixtures and delivery
        run: node scripts/ops/pdro_commercial_rehearsal.mjs
      - name: Build customer review preview
        run: node scripts/ops/build_pdro_delivery_preview.mjs
      - name: Publish explicitly synthetic acceptance evidence
        if: always()
        run: |
          if [ -f ops-output/pdro-imports/Entrega_Pdro_Imports.md ]; then
            cat ops-output/pdro-imports/Entrega_Pdro_Imports.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ops-output/pdro-commercial/Recorrido_Comercial_Pdro_Imports.md ]; then
            cat ops-output/pdro-commercial/Recorrido_Comercial_Pdro_Imports.md >> "$GITHUB_STEP_SUMMARY"
          fi

