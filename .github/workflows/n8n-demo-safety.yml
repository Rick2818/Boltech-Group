name: n8n demo — static safety (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'portfolio/n8n-demo/**'
      - '.github/workflows/n8n-demo-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validate n8n demo structure, recipient and failure routes
        run: node --test portfolio/n8n-demo/test_flow_safety.mjs
