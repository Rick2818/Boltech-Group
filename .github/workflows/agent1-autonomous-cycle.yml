name: Agent 1 autonomous cycle
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boltech-agent1-autonomous
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify configuration
        env:
          SCHEDULER_SECRET: ${{ secrets.BOLTECH_SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "::error::Missing BOLTECH_SCHEDULER_SECRET; no requests dispatched."
            exit 1
          fi
      - name: Run research, then inbox and follow-ups
        env:
          SCHEDULER_SECRET: ${{ secrets.BOLTECH_SCHEDULER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in agent1-continuous-cycle agent1-autonomous-inbox; do
            success=0
            for attempt in 1 2 3; do
              status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 115 --request POST --header "Authorization: Bearer $SCHEDULER_SECRET" --header "Content-Type: application/json" "https://boltech-group.vercel.app/api/$endpoint")" || status=000
              if [[ "$status" == 200 ]]; then
                success=1
                break
              fi
              # Never retry ambiguous POSTs: a timeout or 5xx may follow an executed send.
              if [[ "$status" == 000 || "$status" == 500 || "$status" == 502 || "$status" == 503 || "$status" == 504 ]]; then
                echo "::error::$endpoint ambiguous response HTTP $status; next scheduled cycle must reconcile."
                exit 1
              fi
              if [[ "$status" != 429 ]]; then
                echo "::error::$endpoint failed HTTP $status"
                exit 1
              fi
              sleep $((attempt * 15))
            done
            if [[ "$success" != 1 ]]; then
              echo "::error::$endpoint exhausted rate-limit retries"
              exit 1
            fi
            echo "$endpoint HTTP 200"
          done
