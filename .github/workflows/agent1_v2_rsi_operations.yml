name: Agent 1 V2 RSI Operations
on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 1-5'
permissions:
  contents: read
  actions: read
concurrency:
  group: agent1-v2-rsi-operations
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Observe Agent 1 CI and produce improvement plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/run_agent1_v2_rsi.mjs
      - name: Preserve RSI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v2-rsi-${{ github.run_id }}
          path: ops-output/agent1-v2-rsi-receipt.json
          if-no-files-found: warn
          retention-days: 30
