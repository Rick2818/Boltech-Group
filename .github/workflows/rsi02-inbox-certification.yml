name: RSI-02/03 Inbox Certification
on:
  pull_request:
    paths:
      - 'lib/rsi02_inbox_executor.js'
      - 'api/rsi02-inbox.js'
      - 'tests/test_rsi02_inbox_executor.mjs'
      - 'vercel.json'
      - '.github/workflows/rsi02-inbox-certification.yml'
  workflow_dispatch:
jobs:
  synthetic-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verification
        run: |
          node --check lib/rsi02_inbox_executor.js
          node --check api/rsi02-inbox.js
          node --check tests/test_rsi02_inbox_executor.mjs
      - name: Run synthetic inbox and RSI-03 handoff tests
        run: node --test tests/test_rsi02_inbox_executor.mjs
