name: Boltech Director Agent 4 hourly oversight
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/director-hourly-oversight.yml'
      - 'scripts/ops/audit_director_cycle.mjs'
      - 'lib/marketing_autonomy.js'
      - 'tests/test_marketing_autonomy.mjs'
permissions:
  contents: read
concurrency:
  group: boltech-director-oversight
  cancel-in-progress: false
jobs:
  director-oversight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Director blocker ownership
        run: node --test tests/test_director_ownership.mjs tests/test_director_tracking.mjs tests/test_marketing_autonomy.mjs
      - name: Restore previous blocker history
        uses: actions/cache/restore@v4
        with:
          path: ops-output/director-blockers-history.json
          key: director-history-${{ github.run_id }}
          restore-keys: |
            director-history-
      - name: Run independent autonomous Marketing enablement
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          RSI_EXECUTION_ROLES: 'MARKETING'
          RSI_EXPECT_DEPLOYMENT_SHA: ''
        run: node scripts/ops/run_rsi_agents.mjs
      - name: Run commercial consumers and Director payment notification cycle
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          RSI_EXECUTION_ROLES: 'RSI-02,RSI-03'
          RSI_EXPECT_DEPLOYMENT_SHA: ''
        run: node scripts/ops/run_rsi_agents.mjs
      - name: Audit Director oversight receipt
        if: always()
        run: node scripts/ops/audit_director_cycle.mjs
      - name: Save updated blocker history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ops-output/director-blockers-history.json
          key: director-history-${{ github.run_id }}
      - name: Preserve Director evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-hourly-${{ github.run_id }}
          path: |
            ops-output/marketing-autonomy-execution.json
            ops-output/rsi-agent-execution.json
            ops-output/director-hourly-audit.json
            ops-output/director-blockers-history.json
          if-no-files-found: warn
          retention-days: 30
