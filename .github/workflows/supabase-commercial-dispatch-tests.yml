name: Supabase commercial dispatch tests
on:
  push:
    branches:
      - fix/supabase-commercial-dispatch-gate-20261022
  pull_request:
    paths:
      - 'lib/supabase_commercial_dispatch_gate.js'
      - 'lib/supabase_commercial_executor.js'
      - 'tests/supabase-commercial-*.test.mjs'
      - '.github/workflows/supabase-commercial-dispatch-tests.yml'
  workflow_dispatch:
jobs:
  dispatch-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/supabase-commercial-dispatch-gate.test.mjs tests/supabase-commercial-executor.test.mjs
