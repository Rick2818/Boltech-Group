name: MIT Commercial Control Tower 09:00 SV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mit_commercial_9am.yml'
      - 'scripts/commercial/mit_daily_control_tower.mjs'
      - 'scripts/commercial/zero_to_first_sale.mjs'
      - 'scripts/commercial/traction_cycle.mjs'
      - 'tests/test_traction_cycle.mjs'
      - 'tests/test_commercial_strategy.mjs'
      - 'lib/commercial_strategy.js'
      - 'api/partners.js'
      - 'lib/commercial_cohort_store.js'
      - 'lib/airtable_partner_store.js'
  schedule:
    # El Salvador is UTC-6 year-round. 15:00 UTC = 09:00 America/El_Salvador.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate traction decisions
        run: node --test tests/test_traction_cycle.mjs tests/test_commercial_strategy.mjs

      - name: Run MIT plus RSI-01 RSI-02 RSI-03 commercial control tower
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          EXPLEE_API_KEY: ${{ secrets.EXPLEE_API_KEY }}
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          BOLTECH_URL: https://boltech-group.vercel.app
        run: node scripts/commercial/mit_daily_control_tower.mjs
      - name: Preserve commercial diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-diagnosis-${{ github.run_id }}
          path: ops-output/commercial-report.json
          if-no-files-found: warn
          retention-days: 30

