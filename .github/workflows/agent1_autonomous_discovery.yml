name: Agent 1 autonomous discovery
on:
  # Manual diagnostic only; the existing morning coordinator owns the schedule.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent1-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_agent1_lead_gate.mjs tests/test_agent1_discovery.mjs
      - name: Safe credential preflight
        run: node scripts/commercial/agent1_auth_preflight.mjs
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          BoltechVercelCRM: ${{ secrets.BoltechVercelCRM }}
          LUSHA_API_KEY: ${{ secrets.LUSHA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          UPWORK_MCP_ACCESS_TOKEN: ${{ secrets.UPWORK_MCP_ACCESS_TOKEN }}
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          UPWORK_REFRESH_TOKEN: ${{ secrets.UPWORK_REFRESH_TOKEN }}
          N8N_MCP_URL: ${{ vars.N8N_MCP_URL }}
          N8N_MCP_TOKEN: ${{ secrets.N8N_MCP_TOKEN }}
      - run: node scripts/commercial/agent1_autonomous_discovery.mjs
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          BoltechVercelCRM: ${{ secrets.BoltechVercelCRM }}
          LUSHA_API_KEY: ${{ secrets.LUSHA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          UPWORK_MCP_ACCESS_TOKEN: ${{ secrets.UPWORK_MCP_ACCESS_TOKEN }}
          UPWORK_ORG_UID: ${{ vars.UPWORK_ORG_UID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent1-discovery-receipt
          path: |
            ops-output/agent1-discovery.json
            ops-output/agent1-auth-preflight.json
          retention-days: 30
