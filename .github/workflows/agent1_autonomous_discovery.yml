name: Agent 1 autonomous discovery
on:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent1-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_agent1_lead_gate.mjs tests/test_agent1_discovery.mjs
      - run: node scripts/commercial/agent1_autonomous_discovery.mjs
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          BoltechVercelCRM: ${{ secrets.BoltechVercelCRM }}
          LUSHA_API_KEY: ${{ secrets.LUSHA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent1-discovery-receipt
          path: ops-output/agent1-discovery.json
          retention-days: 30
