name: Synthetic Commercial Intake Routing
on:
  pull_request:
    paths:
      - 'lib/commercial_intake_router.js'
      - 'tests/test_commercial_intake_router.mjs'
      - '.github/workflows/commercial-routing-synthetic.yml'
  workflow_dispatch:
jobs:
  synthetic-routing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline synthetic routing tests
        run: node --test tests/test_commercial_intake_router.mjs
