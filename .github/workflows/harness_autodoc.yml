name: Harness AutoDoc
on:
  # Emergency low-CPU mode (2026-11-04): manual only; preserve Leo + Wompi.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: boltech-harness-autodoc
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_harness_autodoc.mjs
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # workflow_run never checks out, runs, or downloads untrusted producer code.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact Vercel revision and Gmail (no outreach)
        id: probe
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: node scripts/ops/probe_harness_vercel.mjs
      # A negative external OAuth probe is preserved as FAILED in the live issue.
      # It must not block persistence of the failure receipt or generate repeat
      # failures for a documentation-only workflow.
      - name: Update live harness and verify persistence
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/update_harness_autodoc.mjs
      - name: Preserve generated status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-live-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops-output/harness-live-status.json
            ops-output/HARNESS_LIVE_STATUS.md
            ops-output/harness-vercel-probe.json
          if-no-files-found: error
          retention-days: 30
