name: Audit production Apollo lead connector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit_apollo_production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Apollo via authenticated Boltech production route
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://boltech-group.vercel.app/api/partners';
          const token = process.env.PARTNER_API_TOKEN || '';
          if (!token) { console.error('BLOCKED: GITHUB_PARTNER_API_TOKEN_MISSING'); process.exitCode = 1; }
          else {
            for (const action of ['apollo-leads-status', 'apollo-leads-saved']) {
              try {
                const response = await fetch(base + '?action=' + action, {
                  headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
                  signal: AbortSignal.timeout(25000)
                });
                const type = response.headers.get('content-type') || '';
                const data = type.includes('application/json') ? await response.json() : {};
                const code = typeof data.code === 'string' ? data.code : 'NONE';
                const count = Array.isArray(data.leads) ? data.leads.length : null;
                const configured = typeof data.apiKeyConfigured === 'boolean' ? data.apiKeyConfigured : null;
                console.log(JSON.stringify({action,http:response.status,code,configured,leadCount:count,complete:data.complete === true}));
                if (!response.ok || data.success !== true || (action === 'apollo-leads-status' && configured !== true)) process.exitCode = 1;
              } catch { console.error(JSON.stringify({action,code:'NETWORK_OR_TIMEOUT'})); process.exitCode = 1; }
            }
          }
          NODE
