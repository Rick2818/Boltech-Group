name: BLIA-01 Autonomous Discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blia01-discovery.yml'
      - 'scripts/blia01-discovery.cjs'
      - 'tests/test_blia01_discovery.cjs'
      - 'scripts/blia01-rsi-handoff.cjs'
      - 'tests/test_blia01_rsi_handoff.cjs'
      - 'scripts/rsi01-outreach-executor.cjs'
      - 'tests/test_rsi01_outreach_executor.cjs'
      - 'scripts/rsi01-airtable-intake.cjs'
      - 'tests/test_rsi01_airtable_intake.cjs'
      - 'scripts/rsi01-gmail-dispatch.cjs'
      - 'tests/test_rsi01_gmail_dispatch.cjs'
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * 1-5'
permissions:
  contents: read
concurrency:
  group: blia01-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/test_blia01_discovery.cjs tests/test_blia01_rsi_handoff.cjs tests/test_rsi01_outreach_executor.cjs tests/test_rsi01_airtable_intake.cjs tests/test_rsi01_gmail_dispatch.cjs
      - name: Run research-only discovery
        run: node scripts/blia01-discovery.cjs
      - name: Build RSI-01 pending research intake
        run: node scripts/blia01-rsi-handoff.cjs
      - name: Authenticated research intake into RSI-01
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          if [ -n "$AIRTABLE_TOKEN" ] && [ -n "$AIRTABLE_BASE_ID" ]; then
            node scripts/rsi01-airtable-intake.cjs
          else
            echo 'RSI intake BLOCKED: AIRTABLE_TOKEN or AIRTABLE_BASE_ID missing' >&2
            exit 1
          fi
      - name: Prepare RSI-01 verified outreach queue (no send)
        run: node scripts/rsi01-outreach-executor.cjs
      - name: Dispatch verified and explicitly released Gmail intents
        env:
          RSI_GMAIL_SEND_ENABLED: ${{ vars.RSI_GMAIL_SEND_ENABLED }}
          RSI_GMAIL_SENDER: ${{ vars.RSI_GMAIL_SENDER }}
          RSI_APPROVALS_JSON: ${{ secrets.RSI_APPROVALS_JSON }}
          GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          if [ "$RSI_GMAIL_SEND_ENABLED" = 'true' ]; then
            if [ -z "$RSI_APPROVALS_JSON" ]; then echo 'RSI APPROVALS missing; no send' >&2; exit 1; fi
            umask 077
            printf '%s' "$RSI_APPROVALS_JSON" > "$RUNNER_TEMP/rsi-approvals.json"
            RSI_APPROVALS_FILE="$RUNNER_TEMP/rsi-approvals.json" node scripts/rsi01-outreach-executor.cjs
            RSI_APPROVALS_FILE="$RUNNER_TEMP/rsi-approvals.json" node scripts/rsi01-gmail-dispatch.cjs | tee "$RUNNER_TEMP/rsi01-dispatch-receipt.json"
          else
            echo 'RSI Gmail dispatch DISABLED (default)'
          fi
      - name: Report autonomous execution result
        if: always()
        run: |
          echo '## BLIA-01 to RSI-01 autonomous execution' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID / $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Gmail dispatcher is included but disabled by default. Green CI does not establish delivery.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/rsi01-dispatch-receipt.json" ]; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log("Gmail dispatch result: "+r.state+"; sent: "+r.sent)' "$RUNNER_TEMP/rsi01-dispatch-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Gmail dispatch receipt absent: disabled, skipped, or failed; sent not confirmed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/blia01/rsi01-outreach-queue.json ]; then
            node -e 'const q=require("./artifacts/blia01/rsi01-outreach-queue.json"); console.log("Research events: "+q.count+"; blocked: "+q.results.filter(x=>x.status==="BLOCKED_RESEARCH").length+"; ready for approved dispatch: "+q.results.filter(x=>x.status==="APPROVED_PENDING_DISPATCH").length")' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Outreach queue missing: inspect failing step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence for manual qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blia01-research-${{ github.run_id }}
          path: artifacts/blia01/*.json
          if-no-files-found: warn
          retention-days: 14
