name: Agent 1 Marketplace Strategy QA
on:
  pull_request:
    paths:
      - 'lib/agent1_marketplace_cycle.js'
      - 'lib/freelancer_project_source.js'
      - 'lib/rsi01_platform_sources.js'
      - 'lib/marketing_sales_cycle_v2.js'
      - 'lib/marketing_review_dashboard.js'
      - 'marketing-review.html'
      - 'COCKPIT_EJECUTIVO_RICARDO.html'
      - 'tests/test_marketing_review_dashboard.mjs'
      - 'tests/test_marketing_email_login.mjs'
      - 'lib/marketing_passwordless_auth.js'
      - 'api/index.js'
      - 'lib/leo_sales_runtime.js'
      - 'tests/test_leo_idle_ai_cost.mjs'
      - 'api/partners.js'
      - 'api/crm.js'
      - 'api/cron/master-dispatcher.js'
      - 'AGENTS.md'
      - 'REGLA-DE-ORO.md'
      - '.agents/**'
      - 'docs/commercial/MERCADEO_APOYO_VENTAS.md'
      - 'tests/test_legacy_commercial_retirement.mjs'
      - 'vercel.json'
      - 'tests/test_hobby_cpu_route_shield.mjs'
      - 'tests/test_marketplace_strategy.mjs'
      - 'tests/test_cpu_efficiency.mjs'
      - 'tests/test_leo_wompi_lean_mode.mjs'
      - 'lib/leo_wompi_lean_mode.js'
      - '.github/workflows/marketplace_strategy_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marketplace-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/test_hobby_cpu_route_shield.mjs tests/test_leo_idle_ai_cost.mjs tests/test_leo_wompi_lean_mode.mjs tests/test_cpu_efficiency.mjs tests/test_marketplace_strategy.mjs tests/test_legacy_commercial_retirement.mjs tests/test_marketing_review_dashboard.mjs tests/test_marketing_email_login.mjs
