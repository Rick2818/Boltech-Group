name: Telegram incident recovery 2026-10-06
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram_recovery_once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'fix: restore Boltech Telegram connection and truthful replies'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore authorized Boltech destination without dropping updates
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://boltech-group.vercel.app/api/telegram?action=replace-webhook', {
            method: 'POST', headers: { Authorization: 'Bearer ' + process.env.PARTNER_API_TOKEN },
            signal: AbortSignal.timeout(25000)
          });
          const result = await response.json();
          if (!response.ok || result.ok !== true) throw new Error(result.code || 'TELEGRAM_REPAIR_FAILED');
          console.log(result.code);
          const state = await (await fetch('https://boltech-group.vercel.app/api/telegram?deep=1')).json();
          console.log(JSON.stringify(state));
          if (!state.webhookConfigured) throw new Error('TELEGRAM_WEBHOOK_NOT_CONFIRMED');
          JS
