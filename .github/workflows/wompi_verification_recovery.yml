name: Wompi authorized verification recovery
on:
  push:
    branches: [main]
    paths: ['scripts/ops/recover_wompi_verification.mjs', '.github/workflows/wompi_verification_recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wompi-verification-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ops/recover_wompi_verification.mjs
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
