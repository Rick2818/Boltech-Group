name: RSI Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsi_production_acceptance.yml'
      - 'scripts/ops/verify_rsi_production.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rsi-production-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authenticated handoff persistence and transitions
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: node scripts/ops/verify_rsi_production.mjs
      - name: Preserve sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-production-acceptance-${{ github.run_id }}
          path: ops-output/rsi-production-verification.json
          retention-days: 30
          if-no-files-found: error
