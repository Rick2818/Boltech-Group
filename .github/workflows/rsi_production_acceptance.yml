name: RSI Production Acceptance
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsi_production_acceptance.yml'
      - 'scripts/ops/verify_rsi_production.mjs'
      - 'scripts/ops/verify_rsi_agents.mjs'
      - 'lib/rsi_agent_status.js'
      - 'lib/rsi_agent_executor.js'
      - 'lib/google_adk_agents.js'
      - 'lib/interagent_coordinator.js'
      - 'package.json'
      - 'package-lock.json'
      - 'lib/rsi_commercial_routes.js'
      - 'lib/marketing_sales_support.js'
      - 'tests/test_marketing_sales_support.mjs'
      - 'lib/rsi_cycle_runner.js'
      - 'api/partners.js'
      - 'scripts/ops/run_rsi_agents.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boltech-rsi-agent-execution
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Validate commercial routing and isolated failures
        run: node --test tests/test_google_adk_agents.mjs tests/test_interagent_coordinator.mjs tests/test_rsi_agent_executor.mjs tests/test_rsi_commercial_routes.mjs tests/test_rsi_agent_status.mjs tests/test_marketing_sales_support.mjs tests/test_sales_marketing_router.mjs
      - name: Execute one bounded commercial preparation cycle per RSI
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: node scripts/ops/run_rsi_agents.mjs
      - name: Verify four real agent execution receipts
        if: always()
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
        run: node scripts/ops/verify_rsi_agents.mjs
      - name: Verify authenticated handoff persistence and transitions
        if: github.event_name != 'schedule'
        env:
          PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
          RSI_PREVIOUS_QA_ID: qa-production-37143341066
        run: node scripts/ops/verify_rsi_production.mjs
      - name: Preserve sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-production-acceptance-${{ github.run_id }}
          path: |
            ops-output/rsi-production-verification.json
            ops-output/rsi-agent-verification.json
            ops-output/rsi-agent-execution.json
          retention-days: 30
          if-no-files-found: error
