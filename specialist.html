<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentes especializados | Boltech</title><style>body{margin:0;background:#090b0d;color:#f4eee0;font:16px system-ui}main{max-width:760px;margin:35px auto;padding:20px}a{color:#e6c279}header{display:flex;justify-content:space-between}button{cursor:pointer;border:0;border-radius:10px;background:#e0bd6c;padding:12px;font-weight:700}#log{height:340px;overflow:auto;border:1px solid #55472c;border-radius:16px;padding:18px;margin:24px 0;background:#151719}.entry{margin:12px 0;border-radius:12px;background:#26282a;padding:12px;white-space:pre-wrap}.user{background:#3b3124}form{display:flex;gap:8px}input{flex:1;min-width:0;background:#202227;color:white;border:1px solid #655136;border-radius:10px;padding:12px}small{color:#bcb6a8} .agent-hero{display:flex;align-items:center;gap:20px;margin:24px 0;padding:18px;border:1px solid #6e5636;border-radius:20px;background:radial-gradient(circle at 25% 40%,#6a4b1938,#121417 67%)}.agent-portrait{width:152px;height:152px;flex-shrink:0;filter:drop-shadow(0 8px 20px #b9883470);animation:float 4s ease-in-out infinite}.agent-portrait svg{width:100%;height:100%}.agent-hero h1{margin:0 0 12px;font-size:clamp(23px,4vw,36px)}.agent-hero small{line-height:1.55;display:block}#voice-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#listen[hidden],#speech-toggle[hidden]{display:none}@keyframes float{50%{transform:translateY(-7px)}}@media(max-width:520px){.agent-hero{flex-direction:column;text-align:center}.agent-portrait{width:180px;height:180px}}@media(prefers-reduced-motion:reduce){.agent-portrait{animation:none}} </style></head><body><main><header><a href="/">← Boltech Group</a><button id="lang">EN</button></header><section class="agent-hero"><div id="portrait" class="agent-portrait" role="img" aria-label="Avatar del agente"></div><div><h1 id="title"></h1><small id="notice"></small></div></section><div id="voice-controls"><button type="button" id="listen" hidden>🎙 Hablar</button><button type="button" id="speech-toggle">🔊 Voz: no</button></div><div id="log" role="log" aria-live="polite"></div><form id="form"><input id="message" maxlength="900" required autocomplete="off"><button id="send">Enviar</button></form><p id="status" role="status"></p></main><script>
const names={sales:['Ventas','Sales'],support:['Servicio al cliente','Customer support'],marketing:['Mercadeo','Marketing'],finance:['Finanzas','Finance'],logistics:['Logística','Logistics'],chemistry:['Química','Chemistry'],pharma:['Farmacia y registros','Pharmaceutical registration']};
const visual={
 sales:{shape:'visor',tool:'<path d="M138 168l17-18 10 9 19-24" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/><path d="M174 136h12v12" fill="none" stroke="#f7d88a" stroke-width="4"/>'},
 support:{shape:'headset',tool:'<path d="M140 156v-8a23 23 0 0146 0v12M140 151h9v19h-9zm38 0h9v19h-9zM179 172q-8 11-23 7" stroke="url(#gold)" stroke-width="4" fill="#18191b"/><circle cx="156" cy="179" r="3" fill="#ffdd88"/>'},
 marketing:{shape:'antenna',tool:'<path d="M145 163l34-12v24l-34-7zM145 168l-2 12M181 146q12 10 0 20" fill="#292017" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>'},
 finance:{shape:'tall',tool:'<rect x="140" y="139" width="39" height="45" rx="6" fill="#121518" stroke="url(#gold)" stroke-width="3"/><path d="M148 149h23M149 158h5m6 0h5m-16 7h5m6 0h5m-16 7h5m6 0h5" stroke="#f4cf75" stroke-width="3"/>'},
 logistics:{shape:'helmet',tool:'<path d="M142 147h38v34h-38z" fill="#1b1c1d" stroke="url(#gold)" stroke-width="3"/><path d="M142 156l19 9 19-9m-19 9v16" fill="none" stroke="#dfb35d" stroke-width="3"/>'},
 chemistry:{shape:'antenna',tool:'<path d="M153 137h19m-14 0v14l-14 24q-2 6 6 6h25q7 0 4-6l-14-24v-14M150 169h27" fill="#33251b" stroke="url(#gold)" stroke-width="4"/><circle cx="164" cy="170" r="3" fill="#ffda87"/>'},
 pharma:{shape:'helmet',tool:'<g transform="rotate(-35 161 162)"><rect x="143" y="147" width="38" height="25" rx="12" stroke="url(#gold)" stroke-width="4" fill="#1c1b1a"/><path d="M162 148v23" stroke="#ffdb86" stroke-width="3"/></g><path d="M160 181v-12m-6 6h12" stroke="#f9d585" stroke-width="3"/>'}
};
function portraitSVG(type){
 const cfg=visual[type],head=cfg.shape==='visor'
 ?'<path d="M36 85Q31 32 110 34T184 85l-9 54Q111 157 45 139Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="44" y="70" width="132" height="64" rx="28" fill="#060708" stroke="#b78b48" stroke-width="2"/>'
 :cfg.shape==='headset'
 ?'<path d="M45 92Q42 40 110 43T176 92l-10 52q-57 22-112 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><path d="M31 94Q29 25 110 25T189 94" fill="none" stroke="url(#gold)" stroke-width="9"/><rect x="23" y="92" width="22" height="47" rx="9" fill="#141618" stroke="url(#gold)" stroke-width="4"/><rect x="176" y="92" width="22" height="47" rx="9" fill="#141618" stroke="url(#gold)" stroke-width="4"/>'
 :cfg.shape==='helmet'
 ?'<path d="M30 81q8-60 80-60t80 60l-6 12H36z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><path d="M43 89h134v44q-62 40-134 0Z" fill="#080a0d" stroke="url(#gold)" stroke-width="3"/><path d="M26 82h168" stroke="#f9d78d" stroke-width="7" stroke-linecap="round"/>'
 :cfg.shape==='tall'
 ?'<path d="M55 36Q110 10 165 36l18 105q-70 29-146 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="50" y="61" width="120" height="74" rx="31" fill="#070809" stroke="#b18a49" stroke-width="2"/>'
 :'<path d="M33 78Q40 31 110 31t77 47l-12 66q-64 27-131 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="45" y="65" width="130" height="70" rx="33" fill="#060708" stroke="#a57c39" stroke-width="2"/><path d="M110 33V16" stroke="url(#gold)" stroke-width="5"/><circle cx="110" cy="14" r="8" fill="#f8d078"/>';
 const eye=type==='finance'?'<path d="M68 100h29m26 0h29" stroke="#f1c77a" stroke-width="7" stroke-linecap="round"/>':type==='pharma'?'<circle cx="83" cy="99" r="7" fill="#f3cc79"/><circle cx="138" cy="99" r="7" fill="#f3cc79"/>':'<path d="M69 101q14-18 28 0m26 0q14-18 28 0" stroke="#f3cb77" stroke-width="7" fill="none" stroke-linecap="round"/>';
 return '<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="halo"><stop stop-color="#ab7e29" stop-opacity=".32"/><stop offset="1" stop-color="#090b0d" stop-opacity="0"/></radialGradient><linearGradient id="shell"><stop stop-color="#68635b"/><stop offset=".47" stop-color="#1b1c20"/><stop offset="1" stop-color="#08090b"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffe3a0"/><stop offset=".5" stop-color="#a9752a"/><stop offset="1" stop-color="#f9d780"/></linearGradient></defs><circle cx="110" cy="110" r="107" fill="url(#halo)"/><ellipse cx="110" cy="193" rx="73" ry="10" fill="#ae8339" opacity=".25"/><path d="M61 145q16-23 49-23t49 23l13 45q-60 31-124 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="3"/>'+head+eye+'<path d="M56 155q-22-6-19 16l14 13" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="158" r="10" fill="url(#gold)"/>'+cfg.tool+'</svg>';
}
const agentNumbers={sales:'01',support:'02',marketing:'03',finance:'04',logistics:'05',chemistry:'06',pharma:'07'};
const type=new URLSearchParams(location.search).get('type'),valid=Object.hasOwn(names,type),$=id=>document.getElementById(id);let lang='es',history=[];
function update(){if(valid)$('portrait').innerHTML=portraitSVG(type);const en=lang==='en';document.documentElement.lang=lang;$('lang').textContent=en?'ES':'EN';$('title').textContent=valid?(en?'Specialist #':'Agente #')+agentNumbers[type]+' · '+names[type][en?1:0]:(en?'Specialty unavailable':'Especialidad no disponible');$('notice').textContent=en?'Interactive AI consultation. No external account actions or certified autonomous workflows are enabled.':'Consulta interactiva con IA. No están habilitadas acciones externas ni flujos autónomos certificados.';$('message').placeholder=en?'Ask your specialist':'Consulta a tu especialista';$('send').textContent=en?'Send':'Enviar';}
let speakReplies=false;const recognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;$('listen').hidden=!recognitionCtor;$('listen').onclick=()=>{const r=new recognitionCtor();r.lang=lang==='en'?'en-US':'es-SV';r.interimResults=false;$('status').textContent=lang==='en'?'Listening…':'Escuchando…';r.onresult=e=>{$('message').value=e.results[0][0].transcript;$('form').requestSubmit()};r.onerror=()=>{$('status').textContent=lang==='en'?'Microphone unavailable':'Micrófono no disponible'};r.start()};$('speech-toggle').onclick=()=>{speakReplies=!speakReplies;$('speech-toggle').textContent=(speakReplies?'🔊 ':'🔇 ')+(lang==='en'?'Voice: ':'Voz: ')+(speakReplies?'on':'off');if(!speakReplies&&'speechSynthesis'in window)speechSynthesis.cancel()};function speak(text){if(!speakReplies||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'es-SV';u.rate=.95;speechSynthesis.speak(u)}
function show(role,text){const n=document.createElement('div');n.className='entry '+(role==='user'?'user':'');n.textContent=(role==='user'?'• ':'✦ ')+text;$('log').append(n);$('log').scrollTop=$('log').scrollHeight;}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';update();};update();if(!valid)$('form').hidden=true;
$('form').onsubmit=async ev=>{ev.preventDefault();let message=$('message').value.trim();if(!message)return;$('message').value='';show('user',message);$('send').disabled=true;$('status').textContent=lang==='en'?'Consulting AI model…':'Consultando motor de IA…';try{const res=await fetch('/api/index?specialist_chat=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,language:lang,message,history:history.slice(-8)})});const data=await res.json();if(!res.ok||!data.reply)throw Error(data.error||'UNAVAILABLE');show('assistant',data.reply);speak(data.reply);history.push({role:'user',text:message},{role:'assistant',text:data.reply});$('status').textContent='';}catch(e){$('status').textContent=lang==='en'?'AI model unavailable; please retry.':'Modelo de IA no disponible; vuelve a intentar.';}finally{$('send').disabled=false;}};
</script></body></html>
