<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentes especializados | Boltech</title><style>body{margin:0;background:#090b0d;color:#f4eee0;font:16px system-ui}main{max-width:760px;margin:35px auto;padding:20px}a{color:#e6c279}header{display:flex;justify-content:space-between}button{cursor:pointer;border:0;border-radius:10px;background:#e0bd6c;padding:12px;font-weight:700}#log{height:340px;overflow:auto;border:1px solid #55472c;border-radius:16px;padding:18px;margin:24px 0;background:#151719}.entry{margin:12px 0;border-radius:12px;background:#26282a;padding:12px;white-space:pre-wrap}.user{background:#3b3124}form{display:flex;gap:8px}input{flex:1;min-width:0;background:#202227;color:white;border:1px solid #655136;border-radius:10px;padding:12px}small{color:#bcb6a8} .agent-hero{display:flex;align-items:center;gap:20px;margin:24px 0;padding:18px;border:1px solid #6e5636;border-radius:20px;background:radial-gradient(circle at 25% 40%,#6a4b1938,#121417 67%)}.agent-portrait{width:152px;height:152px;flex-shrink:0;filter:drop-shadow(0 8px 20px #b9883470);animation:float 4s ease-in-out infinite}.agent-portrait svg{width:100%;height:100%}.agent-hero h1{margin:0 0 12px;font-size:clamp(23px,4vw,36px)}.agent-hero small{line-height:1.55;display:block}#voice-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#listen[hidden],#speech-toggle[hidden]{display:none}@keyframes float{50%{transform:translateY(-7px)}}@media(max-width:520px){.agent-hero{flex-direction:column;text-align:center}.agent-portrait{width:180px;height:180px}}@media(prefers-reduced-motion:reduce){.agent-portrait{animation:none}} </style></head><body><main><header><a href="/">← Boltech Group</a><button id="lang">EN</button></header><section class="agent-hero"><div id="portrait" class="agent-portrait" role="img" aria-label="Avatar del agente"></div><div><h1 id="title"></h1><small id="notice"></small></div></section><div id="voice-controls"><button type="button" id="listen" hidden>🎙 Hablar</button><button type="button" id="speech-toggle">🔊 Voz: no</button></div><div id="log" role="log" aria-live="polite"></div><form id="form"><input id="message" maxlength="900" required autocomplete="off"><button id="send">Enviar</button></form><p id="status" role="status"></p></main><script>
const names={sales:['Ventas','Sales'],support:['Servicio al cliente','Customer support'],marketing:['Mercadeo','Marketing'],finance:['Finanzas','Finance'],logistics:['Logística','Logistics'],chemistry:['Química','Chemistry'],pharma:['Farmacia y registros','Pharmaceutical registration']};
const motifs={sales:'↗',support:'✦',marketing:'◉',finance:'▥',logistics:'⬡',chemistry:'⚗',pharma:'✚'};
function portraitSVG(motif){return `<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="halo"><stop stop-color="#b88425" stop-opacity=".4"/><stop offset="1" stop-color="#111317" stop-opacity="0"/></radialGradient><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#585552"/><stop offset=".4" stop-color="#17191c"/><stop offset="1" stop-color="#07090b"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffebb2"/><stop offset=".5" stop-color="#bf8733"/><stop offset="1" stop-color="#f7d37e"/></linearGradient></defs><circle cx="110" cy="107" r="106" fill="url(#halo)"/><ellipse cx="110" cy="190" rx="77" ry="12" fill="#b48738" opacity=".22"/><path d="M61 147Q66 120 95 121H127Q156 123 163 147L174 186Q112 208 49 186Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="3"/><circle cx="110" cy="151" r="12" fill="url(#gold)"/><rect x="29" y="44" width="162" height="106" rx="51" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="43" y="57" width="134" height="83" rx="39" fill="#050607" stroke="#6c5739" stroke-width="1"/><rect x="22" y="83" width="22" height="42" rx="11" fill="#161719" stroke="url(#gold)" stroke-width="4"/><rect x="176" y="83" width="22" height="42" rx="11" fill="#161719" stroke="url(#gold)" stroke-width="4"/><path d="M70 100Q85 81 99 100M121 100Q135 81 149 100" fill="none" stroke="#f4c874" stroke-width="8" stroke-linecap="round"/><circle cx="167" cy="160" r="25" fill="#171615" stroke="url(#gold)" stroke-width="4"/><text x="167" y="171" font-size="29" text-anchor="middle" fill="#f8d584" font-family="system-ui">${motif}</text><path d="M54 153Q35 143 37 165L51 178M165 153Q183 143 183 165L171 178" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/></svg>`}
const type=new URLSearchParams(location.search).get('type'),valid=Object.hasOwn(names,type),$=id=>document.getElementById(id);let lang='es',history=[];
function update(){if(valid)$('portrait').innerHTML=portraitSVG(motifs[type]);const en=lang==='en';document.documentElement.lang=lang;$('lang').textContent=en?'ES':'EN';$('title').textContent=valid?(en?'AI specialist: ':'Agente especialista: ')+names[type][en?1:0]:(en?'Specialty unavailable':'Especialidad no disponible');$('notice').textContent=en?'Interactive AI consultation. No external account actions or certified autonomous workflows are enabled.':'Consulta interactiva con IA. No están habilitadas acciones externas ni flujos autónomos certificados.';$('message').placeholder=en?'Ask your specialist':'Consulta a tu especialista';$('send').textContent=en?'Send':'Enviar';}
let speakReplies=false;const recognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;$('listen').hidden=!recognitionCtor;$('listen').onclick=()=>{const r=new recognitionCtor();r.lang=lang==='en'?'en-US':'es-SV';r.interimResults=false;$('status').textContent=lang==='en'?'Listening…':'Escuchando…';r.onresult=e=>{$('message').value=e.results[0][0].transcript;$('form').requestSubmit()};r.onerror=()=>{$('status').textContent=lang==='en'?'Microphone unavailable':'Micrófono no disponible'};r.start()};$('speech-toggle').onclick=()=>{speakReplies=!speakReplies;$('speech-toggle').textContent=(speakReplies?'🔊 ':'🔇 ')+(lang==='en'?'Voice: ':'Voz: ')+(speakReplies?'on':'off');if(!speakReplies&&'speechSynthesis'in window)speechSynthesis.cancel()};function speak(text){if(!speakReplies||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'es-SV';u.rate=.95;speechSynthesis.speak(u)}
function show(role,text){const n=document.createElement('div');n.className='entry '+(role==='user'?'user':'');n.textContent=(role==='user'?'• ':'✦ ')+text;$('log').append(n);$('log').scrollTop=$('log').scrollHeight;}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';update();};update();if(!valid)$('form').hidden=true;
$('form').onsubmit=async ev=>{ev.preventDefault();let message=$('message').value.trim();if(!message)return;$('message').value='';show('user',message);$('send').disabled=true;$('status').textContent=lang==='en'?'Consulting AI model…':'Consultando motor de IA…';try{const res=await fetch('/api/index?specialist_chat=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,language:lang,message,history:history.slice(-8)})});const data=await res.json();if(!res.ok||!data.reply)throw Error(data.error||'UNAVAILABLE');show('assistant',data.reply);speak(data.reply);history.push({role:'user',text:message},{role:'assistant',text:data.reply});$('status').textContent='';}catch(e){$('status').textContent=lang==='en'?'AI model unavailable; please retry.':'Modelo de IA no disponible; vuelve a intentar.';}finally{$('send').disabled=false;}};
</script></body></html>
