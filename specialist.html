<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentes especializados | Boltech</title><style>body{margin:0;background:#090b0d;color:#f4eee0;font:16px system-ui}main{max-width:760px;margin:35px auto;padding:20px}a{color:#e6c279}header{display:flex;justify-content:space-between}button{cursor:pointer;border:0;border-radius:10px;background:#e0bd6c;padding:12px;font-weight:700}#log{height:340px;overflow:auto;border:1px solid #55472c;border-radius:16px;padding:18px;margin:24px 0;background:#151719}.entry{margin:12px 0;border-radius:12px;background:#26282a;padding:12px;white-space:pre-wrap}.user{background:#3b3124}form{display:flex;gap:8px}input{flex:1;min-width:0;background:#202227;color:white;border:1px solid #655136;border-radius:10px;padding:12px}small{color:#bcb6a8}</style></head><body><main><header><a href="/">← Boltech Group</a><button id="lang">EN</button></header><h1 id="title"></h1><small id="notice"></small><div id="log" role="log" aria-live="polite"></div><form id="form"><input id="message" maxlength="900" required autocomplete="off"><button id="send">Enviar</button></form><p id="status" role="status"></p></main><script>
const names={sales:['Ventas','Sales'],support:['Servicio al cliente','Customer support'],marketing:['Mercadeo','Marketing'],finance:['Finanzas','Finance'],logistics:['Logística','Logistics'],chemistry:['Química','Chemistry'],pharma:['Farmacia y registros','Pharmaceutical registration']};
const type=new URLSearchParams(location.search).get('type'),valid=Object.hasOwn(names,type),$=id=>document.getElementById(id);let lang='es',history=[];
function update(){const en=lang==='en';document.documentElement.lang=lang;$('lang').textContent=en?'ES':'EN';$('title').textContent=valid?(en?'AI specialist: ':'Agente especialista: ')+names[type][en?1:0]:(en?'Specialty unavailable':'Especialidad no disponible');$('notice').textContent=en?'Interactive AI consultation. No external account actions or certified autonomous workflows are enabled.':'Consulta interactiva con IA. No están habilitadas acciones externas ni flujos autónomos certificados.';$('message').placeholder=en?'Ask your specialist':'Consulta a tu especialista';$('send').textContent=en?'Send':'Enviar';}
function show(role,text){const n=document.createElement('div');n.className='entry '+(role==='user'?'user':'');n.textContent=(role==='user'?'• ':'✦ ')+text;$('log').append(n);$('log').scrollTop=$('log').scrollHeight;}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';update();};update();if(!valid)$('form').hidden=true;
$('form').onsubmit=async ev=>{ev.preventDefault();let message=$('message').value.trim();if(!message)return;$('message').value='';show('user',message);$('send').disabled=true;$('status').textContent=lang==='en'?'Consulting AI model…':'Consultando motor de IA…';try{const res=await fetch('/api/index?specialist_chat=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,language:lang,message,history:history.slice(-8)})});const data=await res.json();if(!res.ok||!data.reply)throw Error(data.error||'UNAVAILABLE');show('assistant',data.reply);history.push({role:'user',text:message},{role:'assistant',text:data.reply});$('status').textContent='';}catch(e){$('status').textContent=lang==='en'?'AI model unavailable; please retry.':'Modelo de IA no disponible; vuelve a intentar.';}finally{$('send').disabled=false;}};
</script></body></html>
