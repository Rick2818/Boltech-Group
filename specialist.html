<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentes especializados | Boltech</title><style>:root{color-scheme:dark;font:16px system-ui}body{margin:0;background:#090b0e;color:#f5f1e9}main{max-width:900px;margin:30px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#d8b768}button{background:#dfb85e;color:#1e1608;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.agent-hero{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px auto 22px}.agent-portrait{width:144px;height:144px;flex-shrink:0;filter:drop-shadow(0 12px 24px #a7783455);animation:float 3s ease-in-out infinite}.agent-portrait svg{width:100%;height:100%}.agent-hero h1{margin:0;font-size:clamp(27px,4vw,40px)}.chat{border:1px solid #39332a;border-radius:16px;background:#141719;padding:20px;min-height:290px}.line{margin:12px 0;padding:13px;border-radius:12px;line-height:1.5;background:#242423;white-space:pre-wrap}.line.user{background:#3c3120;text-align:right}#log{max-height:420px;overflow:auto}form{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}input{flex:1 1 160px;min-width:0;padding:13px;background:#1a1c20;border:1px solid #5b5140;color:white;border-radius:10px}#voice-controls{display:flex;gap:8px;flex-wrap:wrap}#status{font-size:13px;color:#e5c57d;min-height:1em}small{color:#a8a49c;display:block;margin-top:20px;line-height:1.5}@keyframes float{50%{transform:translateY(-9px)}}@media(max-width:600px){main{padding:14px}.agent-hero{flex-direction:column;text-align:center;gap:4px}.agent-portrait{width:125px;height:125px}.chat{min-height:220px;padding:12px}form{flex-direction:row}#voice-controls{width:100%}#voice-controls button{flex:1 1 auto}}@media(prefers-reduced-motion:reduce){.agent-portrait{animation:none}}</style></head><body><main><header><a href="/">← Boltech Group</a><button id="lang">EN</button></header><section class="agent-hero"><div id="portrait" class="agent-portrait" role="img" aria-label="Avatar del agente"><svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="110" cy="110" r="93" fill="#29251e" stroke="#d6a957" stroke-width="5"/><rect x="43" y="54" width="134" height="105" rx="49" fill="#101215" stroke="#e3bd6b" stroke-width="5"/><path d="M71 105q13-17 28 0m22 0q13-17 28 0" stroke="#f5ce7a" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M75 169q35-19 70 0" stroke="#bf964a" stroke-width="5" fill="none"/></svg></div><h1 id="title">Habla con tu especialista</h1></section><section class="chat"><div id="log" role="log" aria-live="polite"></div></section><form id="form"><input id="message" maxlength="900" required autocomplete="off" placeholder="Escribe tu respuesta"><div id="voice-controls"><button type="button" id="listen">🎙 Hablar</button><button id="send">Enviar</button><button type="button" id="speech-toggle" aria-pressed="true">🔊 Voz: sí</button><button type="button" id="stop-voice">⏹ Detener</button><button type="button" id="replay">▶ Escuchar saludo</button></div></form><p id="status" role="status"></p><small id="notice"></small></main><script>
const names={sales:['Ventas','Sales'],support:['Servicio al cliente','Customer support'],marketing:['Mercadeo','Marketing'],finance:['Finanzas','Finance'],logistics:['Logística','Logistics'],chemistry:['Química, Farmacia y Registros','Chemistry, Pharmacy & Registration']};
const visual={
 sales:{shape:'visor',tool:'<path d="M138 168l17-18 10 9 19-24" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/><path d="M174 136h12v12" fill="none" stroke="#f7d88a" stroke-width="4"/>'},
 support:{shape:'headset',tool:'<path d="M140 156v-8a23 23 0 0146 0v12M140 151h9v19h-9zm38 0h9v19h-9zM179 172q-8 11-23 7" stroke="url(#gold)" stroke-width="4" fill="#18191b"/><circle cx="156" cy="179" r="3" fill="#ffdd88"/>'},
 marketing:{shape:'antenna',tool:'<path d="M145 163l34-12v24l-34-7zM145 168l-2 12M181 146q12 10 0 20" fill="#292017" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>'},
 finance:{shape:'tall',tool:'<rect x="140" y="139" width="39" height="45" rx="6" fill="#121518" stroke="url(#gold)" stroke-width="3"/><path d="M148 149h23M149 158h5m6 0h5m-16 7h5m6 0h5m-16 7h5m6 0h5" stroke="#f4cf75" stroke-width="3"/>'},
 logistics:{shape:'helmet',tool:'<path d="M142 147h38v34h-38z" fill="#1b1c1d" stroke="url(#gold)" stroke-width="3"/><path d="M142 156l19 9 19-9m-19 9v16" fill="none" stroke="#dfb35d" stroke-width="3"/>'},
 chemistry:{shape:'antenna',tool:'<path d="M153 137h19m-14 0v14l-14 24q-2 6 6 6h25q7 0 4-6l-14-24v-14M150 169h27" fill="#33251b" stroke="url(#gold)" stroke-width="4"/><circle cx="164" cy="170" r="3" fill="#ffda87"/>'}
};
function portraitSVG(type){
 const cfg=visual[type],head=cfg.shape==='visor'
 ?'<path d="M36 85Q31 32 110 34T184 85l-9 54Q111 157 45 139Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="44" y="70" width="132" height="64" rx="28" fill="#060708" stroke="#b78b48" stroke-width="2"/>'
 :cfg.shape==='headset'
 ?'<path d="M45 92Q42 40 110 43T176 92l-10 52q-57 22-112 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><path d="M31 94Q29 25 110 25T189 94" fill="none" stroke="url(#gold)" stroke-width="9"/><rect x="23" y="92" width="22" height="47" rx="9" fill="#141618" stroke="url(#gold)" stroke-width="4"/><rect x="176" y="92" width="22" height="47" rx="9" fill="#141618" stroke="url(#gold)" stroke-width="4"/>'
 :cfg.shape==='helmet'
 ?'<path d="M30 81q8-60 80-60t80 60l-6 12H36z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><path d="M43 89h134v44q-62 40-134 0Z" fill="#080a0d" stroke="url(#gold)" stroke-width="3"/><path d="M26 82h168" stroke="#f9d78d" stroke-width="7" stroke-linecap="round"/>'
 :cfg.shape==='tall'
 ?'<path d="M55 36Q110 10 165 36l18 105q-70 29-146 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="50" y="61" width="120" height="74" rx="31" fill="#070809" stroke="#b18a49" stroke-width="2"/>'
 :'<path d="M33 78Q40 31 110 31t77 47l-12 66q-64 27-131 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="4"/><rect x="45" y="65" width="130" height="70" rx="33" fill="#060708" stroke="#a57c39" stroke-width="2"/><path d="M110 33V16" stroke="url(#gold)" stroke-width="5"/><circle cx="110" cy="14" r="8" fill="#f8d078"/>';
 const eye=type==='finance'?'<path d="M68 100h29m26 0h29" stroke="#f1c77a" stroke-width="7" stroke-linecap="round"/>':type==='chemistry'?'<circle cx="83" cy="99" r="7" fill="#f3cc79"/><circle cx="138" cy="99" r="7" fill="#f3cc79"/>':'<path d="M69 101q14-18 28 0m26 0q14-18 28 0" stroke="#f3cb77" stroke-width="7" fill="none" stroke-linecap="round"/>';
 return '<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="halo"><stop stop-color="#ab7e29" stop-opacity=".32"/><stop offset="1" stop-color="#090b0d" stop-opacity="0"/></radialGradient><linearGradient id="shell"><stop stop-color="#68635b"/><stop offset=".47" stop-color="#1b1c20"/><stop offset="1" stop-color="#08090b"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffe3a0"/><stop offset=".5" stop-color="#a9752a"/><stop offset="1" stop-color="#f9d780"/></linearGradient></defs><circle cx="110" cy="110" r="107" fill="url(#halo)"/><ellipse cx="110" cy="193" rx="73" ry="10" fill="#ae8339" opacity=".25"/><path d="M61 145q16-23 49-23t49 23l13 45q-60 31-124 0Z" fill="url(#shell)" stroke="url(#gold)" stroke-width="3"/>'+head+eye+'<path d="M56 155q-22-6-19 16l14 13" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="158" r="10" fill="url(#gold)"/>'+cfg.tool+'</svg>';
}
const agentNames={sales:'Max',support:'Mia',marketing:'Zia',finance:'Nix',logistics:'Kiro',chemistry:'Nova'};
const agentNumbers={sales:'01',support:'02',marketing:'03',finance:'04',logistics:'05',chemistry:'06'};
const requestedType=new URLSearchParams(location.search).get('type');const type=requestedType==='pharma'?'chemistry':requestedType,valid=Object.prototype.hasOwnProperty.call(names,type),$=id=>document.getElementById(id);let lang='es',history=[];
function update(){if(valid){try{$('portrait').innerHTML=portraitSVG(type)}catch(error){console.error('Portrait unavailable',error)}}const en=lang==='en';document.documentElement.lang=lang;$('lang').textContent=en?'ES':'EN';$('title').textContent=valid?(en?'Talk to ':'Habla con ')+agentNames[type]:(en?'Specialty unavailable':'Especialidad no disponible');$('notice').textContent=en?'Interactive AI consultation. No external account actions or certified autonomous workflows are enabled.':'Consulta interactiva con IA. No están habilitadas acciones externas ni flujos autónomos certificados.';$('message').placeholder=en?'Talk to '+agentNames[type]:'Habla con '+agentNames[type];$('send').textContent=en?'Send':'Enviar';$('replay').textContent=en?'▶ Hear greeting':'▶ Escuchar saludo';$('stop-voice').textContent=en?'⏹ Stop':'⏹ Detener';if(valid&&$('log').firstElementChild?.dataset.welcome==='1'){$('log').firstElementChild.textContent='✦ '+(en?'Hello! I am ':'¡Hola! Soy ')+agentNames[type]+(en?', specialized in ':', especialista en ')+names[type][en?1:0]+(en?'. How can I help you?':'. ¿En qué puedo ayudarte?');}}
let speakReplies=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);let activeRecognition=null;
let neuralAudio=null,neuralObjectUrl=null,voiceRequest=0,claudeEnabled=false,claudeEngine=null,claudeLoading=null;
function stopSpeaking(){voiceRequest++;if('speechSynthesis' in window)speechSynthesis.cancel();if(neuralAudio){neuralAudio.pause();neuralAudio.src='';neuralAudio=null;}if(neuralObjectUrl){URL.revokeObjectURL(neuralObjectUrl);neuralObjectUrl=null;}}

function spokenText(value){return String(value||'').replace(/`{1,3}[^`]*`{1,3}/g,' ').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\*|_|[#>~]/g,' ').replace(/\s+/g,' ').trim();}
function preferredVoice(){const vs=speechSynthesis.getVoices();const spanish=vs.filter(v=>/^es[-_]MX$/i.test(v.lang));const latin=vs.filter(v=>/^es[-_](MX|SV|GT|CO|CL|AR|US)$/i.test(v.lang));const pool=lang==='en'?vs.filter(v=>/^en/i.test(v.lang)):(spanish.length?spanish:latin);return pool.find(v=>/female|femenina|claude|dalia|sabina|paloma|paulina|maria|monica|sofia|lucia/i.test(v.name))||pool[0]||null;}
const recognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;$('listen').disabled=!recognitionCtor; if(!recognitionCtor)$('listen').title='Reconocimiento de voz no disponible / Speech input unavailable'; if(!speakReplies){$('speech-toggle').disabled=true;$('speech-toggle').textContent='🔇 Voz no disponible / Voice unavailable';}$('listen').onclick=()=>{stopSpeaking();if(activeRecognition){try{activeRecognition.abort()}catch{}activeRecognition=null;}if(!recognitionCtor)return;const r=new recognitionCtor();activeRecognition=r;r.lang=lang==='en'?'en-US':'es-MX';r.interimResults=true;$('status').textContent=lang==='en'?'Listening…':'Escuchando…';r.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;}$('message').value=final||interim;if(final.trim()){activeRecognition=null;try{r.stop()}catch{}$('form').requestSubmit()}};r.onerror=()=>{$('status').textContent=lang==='en'?'Microphone unavailable':'Micrófono no disponible';activeRecognition=null};r.onend=()=>{if(activeRecognition===r)activeRecognition=null};try{r.start()}catch{$('status').textContent=lang==='en'?'Microphone unavailable':'Micrófono no disponible'}};
$('speech-toggle').onclick=()=>{speakReplies=!speakReplies;$('speech-toggle').setAttribute('aria-pressed',String(speakReplies));$('speech-toggle').textContent=(speakReplies?'🔊 ':'🔇 ')+(lang==='en'?'Voice: ':'Voz: ')+(speakReplies?(lang==='en'?'on':'sí'):(lang==='en'?'off':'no'));if(!speakReplies)stopSpeaking()};
$('stop-voice').onclick=()=>{stopSpeaking();$('status').textContent=lang==='en'?'Voice stopped. You can speak.':'Voz detenida. Puedes hablar.'};
async function speak(text){if(!speakReplies)return;stopSpeaking();const request=voiceRequest,clean=spokenText(text);if(!clean)return;if(lang==='es'){try{$('status').textContent='Preparando voz de María…';const resp=await fetch('/api/index?maria_speech=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean.slice(0,300)})});if(request!==voiceRequest)return;if(!resp.ok)throw Error('MARIA_UNAVAILABLE');const blob=await resp.blob();if(request!==voiceRequest)return;neuralObjectUrl=URL.createObjectURL(blob);neuralAudio=new Audio(neuralObjectUrl);await neuralAudio.play();$('status').textContent='';}catch(e){if(request===voiceRequest)$('status').textContent='María no está configurada o disponible.';}return;}if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(clean);u.lang='en-US';u.rate=1;speechSynthesis.speak(u);}
$('replay').onclick=()=>{const first=$('log').firstElementChild;if(first)speak(first.textContent.replace(/^✦ /,''))};
function show(role,text){const n=document.createElement('div');n.className='line '+(role==='user'?'user':'');n.textContent=(role==='user'?'• ':'✦ ')+text;$('log').append(n);$('log').scrollTop=$('log').scrollHeight;}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';update();};update();if(valid){show('assistant',lang==='en'?'Hello! I am '+agentNames[type]+', specialized in '+names[type][1]+'. How can I help you?':'¡Hola! Soy '+agentNames[type]+', especialista en '+names[type][0]+'. ¿En qué puedo ayudarte?');$('log').firstElementChild.dataset.welcome='1';}else $('form').hidden=true;
$('form').onsubmit=async ev=>{ev.preventDefault();stopSpeaking();let message=$('message').value.trim();if(!message)return;$('message').value='';show('user',message);$('send').disabled=true;$('status').textContent=lang==='en'?'Consulting AI model…':'Consultando motor de IA…';try{const res=await fetch('/api/index?specialist_chat=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,language:lang,message,history:history.slice(-8)})});const data=await res.json();if(!res.ok||!data.reply)throw Error(data.error||'UNAVAILABLE');show('assistant',data.reply);speak(data.reply);history.push({role:'user',text:message},{role:'assistant',text:data.reply});$('status').textContent='';}catch(e){$('status').textContent=lang==='en'?'AI model unavailable; please retry.':'Modelo de IA no disponible; vuelve a intentar.';}finally{$('send').disabled=false;}};
</script></body></html>
