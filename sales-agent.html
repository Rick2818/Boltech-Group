<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leo · Ventas Boltech</title>
<style>:root{color-scheme:dark;font:16px system-ui}body{margin:0;background:#090b0e;color:#f5f1e9}main{max-width:700px;margin:30px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}a{color:#d8b768}.title{color:#d8b768;letter-spacing:.13em;font-weight:800}.mascot{margin:35px auto 15px;width:138px;height:165px;position:relative;border-radius:33% 40% 28% 37%;background:linear-gradient(130deg,#fff0a8,#bc8c36 49%,#72491c);box-shadow:0 15px 35px #0008,inset 10px 10px 15px #fff3;transform:rotate(-3deg);animation:float 3s ease-in-out infinite}.eyes{display:flex;gap:35px;position:absolute;top:58px;left:28px}.eye{width:15px;height:24px;background:#17130d;border-radius:50%;box-shadow:inset 4px 3px #fff8}.smile{position:absolute;top:103px;left:57px;width:23px;height:12px;border:3px solid #221908;border-top:none;border-radius:0 0 20px 20px}.foot{position:absolute;width:39px;height:18px;background:#9a6b23;bottom:-6px;border-radius:50%}.foot.a{left:13px}.foot.b{right:13px}@keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}.chat{border:1px solid #39332a;border-radius:16px;background:#141719;padding:20px;min-height:220px}.line{margin:12px 0;padding:13px;border-radius:12px;line-height:1.5;background:#242423}.line.user{background:#3c3120;text-align:right}form{display:flex;gap:8px;margin-top:15px}input{flex:1;min-width:0;padding:13px;background:#1a1c20;border:1px solid #5b5140;color:white;border-radius:10px}button{background:#dfb85e;color:#1e1608;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}small{color:#a8a49c;display:block;margin-top:20px;line-height:1.5}#summary{white-space:pre-wrap;color:#e5c57d;margin-top:18px}</style></head><body><main><header><a href="/">← Boltech</a><div class="title">LEO · SALES DOT</div><button id="lang">EN</button></header><div class="mascot" aria-label="Leo, mascota de ventas"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="smile"></div><div class="foot a"></div><div class="foot b"></div></div><h1 id="heading">Habla con Leo</h1><div class="chat" id="chat" role="log" aria-live="polite"></div><form id="form"><input id="message" autocomplete="off" maxlength="800" placeholder="Escribe tu respuesta" required><button id="send">Enviar</button></form><div id="summary"></div><small id="note">Piloto conversacional: el resumen permanece en esta sesión. No envía correos, no toma pedidos ni cobra. Para continuar, solicita cotización al equipo de Boltech.</small></main>
<script type="module">
let language='es',history=[],busy=false;
const chat=document.getElementById('chat'),input=document.getElementById('message'),send=document.getElementById('send');
const startText={es:'¡Hola! Soy Leo, asesor de Ventas de Boltech. ¿Qué proceso te gustaría automatizar?',en:'Hi! I’m Leo, Boltech’s Sales assistant. What workflow would you like to automate?'};
function add(text,who){const p=document.createElement('div');p.className='line '+(who==='user'?'user':'agent');p.textContent=text;chat.appendChild(p);p.scrollIntoView({block:'nearest'})}
function start(){history=[];chat.replaceChildren();add(startText[language],'agent');document.getElementById('heading').textContent=language==='es'?'Habla con Leo':'Talk to Leo';send.textContent=language==='es'?'Enviar':'Send';document.getElementById('lang').textContent=language==='es'?'EN':'ES';document.getElementById('summary').textContent='';document.getElementById('note').textContent=language==='es'?'Leo orienta y prepara el diagnóstico. No confirma pedidos, envía correos ni procesa pagos. Las cotizaciones necesitan aprobación.':'Leo provides guidance and scoping. No orders, emails or payments are processed. Quotes require approval.'}
document.getElementById('lang').onclick=()=>{if(busy)return;language=language==='es'?'en':'es';start()};
document.getElementById('form').onsubmit=async e=>{
e.preventDefault();if(busy)return;const msg=input.value.trim();if(!msg)return;input.value='';add(msg,'user');busy=true;send.disabled=true;
try{
const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),20000);
let resp;
try{resp=await fetch('/api/index?leo_sales=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,language,history:history.slice(-12)}),signal:controller.signal})}
finally{clearTimeout(timeout)}
const data=await resp.json().catch(()=>null);
if(!resp.ok||!data?.success||typeof data.reply!=='string'||!data.reply.trim())throw Error('LEO_HTTP_'+resp.status);
const reply=data.reply.trim();add(reply,'agent');history.push({role:'user',text:msg},{role:'assistant',text:reply});history=history.slice(-12)
}catch(err){
const code=err?.name==='AbortError'?'TIMEOUT':String(err?.message||'NETWORK_ERROR').replace(/[^A-Z0-9_]/gi,'').slice(0,35);
add((language==='es'?'Leo no pudo responder en este momento. Inténtalo de nuevo. Código: ':'Leo could not respond. Please retry. Code: ')+code,'agent')
}
finally{busy=false;send.disabled=false;input.focus()}
};start();
</script></body></html>
